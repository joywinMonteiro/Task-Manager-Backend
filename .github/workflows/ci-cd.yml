name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Run lint / test (placeholder)
      run: echo "No tests configured"

    - name: Build Docker Image
      run: docker build -t task-manager-api .

    - name: Push Docker Image to GHCR
      env:
        CR_PAT: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker tag task-manager-api ghcr.io/${{ github.repository_owner }}/task-manager-api:latest
        docker push ghcr.io/${{ github.repository_owner }}/task-manager-api:latest
