version: "3.9"

services:
  api:
    build: .
    container_name: task-manager-api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/taskmanager
      PORT: 5000
    command: npm run start

  mongo:
    image: mongo:6
    container_name: task-manager-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
